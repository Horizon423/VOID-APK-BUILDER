# void-apk-builder:managed v2
# Generated by VOID APK BUILDER (Developed by Void Kernel 12). Remove the marker line above to stop VOID from updating this file.
name: VOID APK Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug or release"
        required: true
        default: "debug"
        type: choice
        options: [debug, release]
      project_dir:
        description: "Gradle project directory (blank = auto-detect)"
        required: false
        default: ""
      gradle_task:
        description: "Custom Gradle task (blank = assembleDebug / assembleRelease)"
        required: false
        default: ""
      jdk:
        description: "JDK version"
        required: false
        default: "17"

concurrency:
  group: void-apk-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.jdk || '17' }}

      - name: Prepare Android SDK (preinstalled on ubuntu runners)
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            echo "Licenses accepted using $SDKM"
          else
            echo "sdkmanager not found; relying on licenses already present in the runner image"
          fi
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Locate Gradle project
        id: loc
        shell: bash
        env:
          IN_DIR: ${{ inputs.project_dir }}
        run: |
          DIR="$IN_DIR"
          if [ -z "$DIR" ]; then
            F=$(find . -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
            if [ -z "$F" ]; then echo "::error::No settings.gradle(.kts) found within 4 levels"; exit 1; fi
            DIR=$(dirname "$F")
          fi
          if [ ! -d "$DIR" ]; then echo "::error::Project directory '$DIR' not found"; exit 1; fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          if [ -f "$DIR/gradlew" ]; then
            chmod +x "$DIR/gradlew"
            echo "wrapper=true" >> "$GITHUB_OUTPUT"
          else
            echo "wrapper=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.loc.outputs.wrapper == 'true' && 'wrapper' || '8.7' }}
          build-root-directory: ${{ steps.loc.outputs.dir }}

      - name: Build
        shell: bash
        working-directory: ${{ steps.loc.outputs.dir }}
        env:
          BT: ${{ inputs.build_type }}
          TASK: ${{ inputs.gradle_task }}
          WRAPPER: ${{ steps.loc.outputs.wrapper }}
        run: |
          if [ -z "$TASK" ]; then
            if [ "$BT" = "release" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          fi
          if [ "$WRAPPER" = "true" ]; then CMD=./gradlew; else CMD=gradle; fi
          echo "Running: $CMD $TASK"
          $CMD $TASK --no-daemon --stacktrace

      - name: Collect and (optionally) sign APKs
        shell: bash
        env:
          BT: ${{ inputs.build_type }}
          KS_B64: ${{ secrets.VOID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.VOID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VOID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.VOID_KEY_PASSWORD }}
        run: |
          mkdir -p void-out
          find . -path '*/build/outputs/apk/*' -name '*.apk' -not -path './void-out/*' -exec cp {} void-out/ \;
          COUNT=$(ls void-out/*.apk 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then echo "::error::Gradle finished but no APK was found under build/outputs/apk"; exit 1; fi
          SIGNED=false
          NOTE="Debug build signed with the Android debug key. Not for distribution."
          if [ "$BT" = "release" ]; then
            NOTE="Release build was not signed by VOID APK BUILDER (VOID_KEYSTORE secrets missing). Signing state depends on the project's own Gradle signingConfig."
            if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
              BTV=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
              echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
              for APK in void-out/*unsigned*.apk; do
                [ -e "$APK" ] || continue
                ALIGNED="${APK%.apk}-aligned.apk"
                OUT="${APK/unsigned/signed}"
                "$ANDROID_HOME/build-tools/$BTV/zipalign" -p -f 4 "$APK" "$ALIGNED"
                "$ANDROID_HOME/build-tools/$BTV/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out "$OUT" "$ALIGNED"
                "$ANDROID_HOME/build-tools/$BTV/apksigner" verify "$OUT"
                rm -f "$ALIGNED" "$APK"
                SIGNED=true
              done
              rm -f "$RUNNER_TEMP/release.jks"
              if [ "$SIGNED" = "true" ]; then NOTE="Release APK signed with your keystore."; fi
            fi
          fi
          printf '{"build_type":"%s","signed":%s,"note":"%s"}\n' "$BT" "$SIGNED" "$NOTE" > void-out/void-build-info.json
          ls -la void-out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: void-apk-${{ inputs.build_type }}-${{ github.run_number }}
          path: void-out/
          if-no-files-found: error
          retention-days: 14
